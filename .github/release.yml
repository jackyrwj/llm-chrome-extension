changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]

  categories:
    - title: "🚀 New Features"
      labels:
        - feature
        - enhancement

    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - bugfix

    - title: "📚 Documentation"
      labels:
        - documentation

    - title: "🧰 CI and Maintenance"
      labels:
        - ci
        - chore
        - maintenance

    - title: "📦 Other Changes"
      labels:
        - "*"
