name: CI

# 跑在 GitHub 托管 runner 上。
#
# 这个文件曾经迁到自建 runner（校内 GPU 服务器），后来又迁了回来。
# 迁回的原因，以及当初为自建加的三处变通，一并记在这里，免得以后重蹈覆辙：
#
# 1. runs-on 从 [self-hosted, <机器>] 改回 ubuntu-latest
#    自建 runner 的正当理由只有三条：需要 GPU、需要访问内网资源、
#    私有仓库分钟数不够。本项目一条都不占——纯前端 Chrome 扩展，
#    测试只用 node --test，不装任何依赖，而且是公开仓库（托管 runner 免费）。
#    自建的代价却是实打实的：机器要自己维护（首次构建就因为某台机器没装 zip
#    而失败）、runner 掉线整条流水线就卡住、公开仓库还有 fork PR
#    在自己服务器上执行任意代码的安全问题。
#
# 2. tarball 检出改回 actions/checkout
#    当初改成走 api.github.com 的 tarball 接口，是因为校园服务器到 github.com
#    的 TLS 握手存在概率性干扰，git clone 会随机卡满 3 分钟超时。
#    托管 runner 在 GitHub 自己的网络里，没有这个问题。
#    附带好处：tarball 没有 .git 目录，当初空白检查只能改成调 API 取 diff；
#    现在可以用回 git diff --check。
#
# 3. actions/setup-node 加回来
#    自建版本删掉它，是因为机器上已装好 Node、且下载发行包要走那条不稳的网络，
#    代价是运行时版本由机器决定（所以当时加了显式版本校验步骤兜底）。
#    托管 runner 每次都是干净环境，版本由本文件声明——这反而更可靠，
#    版本校验步骤也就不需要了。

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run tests
        run: node --test tests/*.js

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      # 空白检查要比对改动范围，需要完整历史
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          find src tests -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Check whitespace errors
        run: |
          set -uo pipefail
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          zero='0000000000000000000000000000000000000000'

          if [ -z "$base" ] || [ "$base" = "$zero" ]; then
            echo "无可比对的基准提交（新分支首推），跳过"
            exit 0
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "基准提交 ${base} 不在检出的历史中，跳过"
            exit 0
          fi

          git diff --check "$base" HEAD

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate extension files
        run: |
          test -f manifest.json
          python3 -m json.tool manifest.json > /dev/null
          for d in src icons docs; do test -d "$d"; done
          test -f privacy-policy.html

