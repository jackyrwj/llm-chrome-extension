name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run tests
        run: node --test tests/*.js

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          find src tests -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Check whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" HEAD

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate extension files
        run: |
          test -f manifest.json
          python3 -m json.tool manifest.json > /dev/null
          test -d src
          test -d icons
          test -d docs
          test -f privacy-policy.html

      - name: Create extension archive
        run: |
          zip -r llm-chrome-extension.zip \
            manifest.json \
            src \
            icons \
            docs \
            privacy-policy.html \
            -x '*.DS_Store'

      - name: Verify archive
        run: test -s llm-chrome-extension.zip